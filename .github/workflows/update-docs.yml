name: Update Versioned Documentation

on:
  repository_dispatch:
    types: [docs-update]

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  update-docs:
    runs-on: ubuntu-latest

    env:
      VERSION: ${{ github.event.client_payload.version  }}
      REFERENCE_FILE: "fern/sdk/reference.md"
      REFERENCE_SOURCE_DIR: "fern/sdk"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ env.VERSION }}
          persist-credentials: false

      - name: Validate reference.md exists
        run: |
          set -euo pipefail
          if [ ! -f "$REFERENCE_FILE" ]; then
            echo "ERROR: Reference file not found: $REFERENCE_FILE"
            exit 1
          fi
          echo "Found reference: $REFERENCE_FILE"

      - name: Prepare versioned GitHub Pages documentation
        run: python3 generator/scripts/prepare_docs.py --version "$VERSION" --source "$REFERENCE_FILE"

      - name: Create PR for docs update
        id: create-pr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: ${{ github.event.repository.default_branch }}
          commit-message: "docs: update docs for ${{ env.VERSION }}"
          branch: "docs/update-${{ env.VERSION }}"
          title: "docs: update docs for ${{ env.VERSION }}"
          body: |
            Automated documentation update for release **${{ env.VERSION }}**.

            - Updated `docs/latest/reference.md`
            - Added/updated `docs/${{ env.VERSION }}/reference.md`
            - Regenerated `docs/index.md` with all versioned docs

          labels: |
            docs
            automated

      - name: Validate generated docs PR
        if: steps.create-pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BRANCH: ${{ steps.create-pr.outputs.pull-request-branch }}
        run: gh workflow run docs-validation.yml --ref "$PR_BRANCH"
