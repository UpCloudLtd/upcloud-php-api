# yaml-language-server: $schema=https://schema.buildwithfern.dev/generators-yml.json

api:
  specs:
    - openapi: ../generator/openapi/spec.patched.json

default-group: local

groups:
  local:
    generators:
      - name: fernapi/fern-php-sdk
        version: 1.25.0
        config:
          enable-wire-tests: true
        output:
          location: local-file-system
          path: ./sdk
